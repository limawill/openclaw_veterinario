[tool.poetry]
name = "yumi-agent"
version = "0.1.0"
description = "Agente virtual Yumi para clínica veterinária"
authors = ["Will Lima"]
packages = [{ include = "yumi", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.133.1"
uvicorn = { extras = ["standard"], version = "^0.41.0" }
sqlalchemy = "^2.0.47"
python-dotenv = "^1.2.1"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
python-jose = { extras = ["cryptography"], version = "^3.5.0" }
passlib = { extras = ["bcrypt"], version = "==1.7.4" }
python-multipart = "^0.0.22"
bcrypt = "4.0.1"                                                # Versão fixa
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
ruff = "^0.15.4"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
